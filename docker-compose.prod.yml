# Prod environment only (019-env-separation). Fully independent of
# docker-compose.dev.yml - `docker compose -f docker-compose.prod.yml up`
# never builds, starts, or otherwise touches any dev container.
#
# See docker-compose.dev.yml for the shared-status-volume rationale, the
# FR-014 one-denidin-at-a-time-for-real-traffic constraint, and the
# 2026-07-21 correction: NEITHER app is exempt from CLAUDE.md's "ONE
# ENVIRONMENT SET AT A TIME" rule - morning-mcp-app-prod does NOT get to run
# alongside morning-mcp-app-dev (an earlier version of this comment wrongly
# claimed it could; that assumption caused a real incident).
# prod is a singleton across clones (root/coder1/coder2, ...):
# DENIDIN_PROD_DATA_DIR / *_LOGS_DIR default to this clone's own paths but
# are overridable per clone (via a gitignored .env.local, see CLAUDE.md) to
# point at one canonical directory instead, so real production data/logs
# never fragment depending on which clone started prod.
name: denidin-prod
services:
  denidin-app-prod:
    build:
      context: ./apps/denidin-app
    volumes:
      - ./apps/denidin-app/config/config.prod.json:/app/config/config.json:ro
      - ${DENIDIN_PROD_DATA_DIR:-./apps/denidin-app/data}:/app/data
      - ${DENIDIN_PROD_LOGS_DIR:-./apps/denidin-app/logs/prod}:/app/logs
      - ./shared/mcp-status-prod:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"

  morning-mcp-app-prod:
    build:
      context: ./apps/morning-mcp-app
    ports:
      - "8001:8000"
    volumes:
      - ./apps/morning-mcp-app/config/config.prod.json:/app/config/config.json:ro
      - ${MORNING_PROD_LOGS_DIR:-./apps/morning-mcp-app/logs/prod}:/app/logs
      - ./shared/mcp-status-prod:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"
