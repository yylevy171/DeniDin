# Dev environment only (019-env-separation). Fully independent of
# docker-compose.prod.yml - `docker compose -f docker-compose.dev.yml up`
# never builds, starts, or otherwise touches any prod container.
#
# denidin-app-dev and morning-mcp-app-dev do not share a network namespace or
# import each other's code - denidin-app-dev reaches morning-mcp-app-dev only
# as a remote MCP tool, over a real (dev-only) ngrok tunnel that OpenAI's
# Responses API calls out to. The mcp-status-dev bind mount is the one thing
# they DO need to share: morning-mcp-app-dev writes its live tunnel URL there,
# and denidin-app-dev polls it to discover that URL. This directory is never
# mounted into any prod container (see docker-compose.prod.yml), which is
# what makes cross-environment MCP resolution structurally impossible (FR-010).
#
# IMPORTANT (FR-014): denidin-app-dev and denidin-app-prod share one real
# Green API instance (one paid WhatsApp number, no sandbox tier exists).
# GreenAPIBot polls for notifications rather than receiving pushed webhooks,
# so only one of denidin-app-dev/denidin-app-prod should be actively running
# whenever real WhatsApp traffic could arrive - see quickstart.md's hand-off
# procedure.
#
# NEITHER app gets an exception from CLAUDE.md's "ONE ENVIRONMENT SET AT A
# TIME" rule (corrected 2026-07-21 - an earlier version of this comment
# claimed morning-mcp-app-dev/-prod had no such restriction and could always
# run together; that assumption caused a real incident: a leftover
# morning-mcp-app-prod container, with real production credentials, was
# silently reachable through this app's own test config while dev/test work
# was believed to be isolated). `restart: "no"` below + watchdog.py inside
# each container + killall_containers.sh are the mechanisms that now enforce
# this - see CLAUDE.md's top-of-file rule for the full policy.
# dev is a singleton across clones (root/coder1/coder2, ... - see
# env_lock.sh): DENIDIN_DEV_DATA_DIR / *_LOGS_DIR default to this clone's
# own paths but are overridable per clone (via a gitignored .env.local, see
# CLAUDE.md) to point at one canonical directory instead, so it doesn't
# matter which clone last held the dev lock - the same session data/logs
# are always used.
name: denidin-dev
services:
  denidin-app-dev:
    build:
      context: ./apps/denidin-app
    volumes:
      - ./apps/denidin-app/config/config.dev.json:/app/config/config.json:ro
      - ${DENIDIN_DEV_DATA_DIR:-./apps/denidin-app/dev_data}:/app/dev_data
      - ${DENIDIN_DEV_LOGS_DIR:-./apps/denidin-app/logs/dev}:/app/logs
      - ./shared/mcp-status-dev:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"

  morning-mcp-app-dev:
    build:
      context: ./apps/morning-mcp-app
    ports:
      - "8000:8000"
    volumes:
      - ./apps/morning-mcp-app/config/config.dev.json:/app/config/config.json:ro
      - ${MORNING_DEV_LOGS_DIR:-./apps/morning-mcp-app/logs/dev}:/app/logs
      - ./shared/mcp-status-dev:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"
