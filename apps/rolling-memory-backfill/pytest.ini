[pytest]
# Skip billed tests by default - mirrors apps/denidin-app/pytest.ini and
# apps/prod-ledger-backfill/pytest.ini. No "expensive" tier (no vision calls anywhere
# in this pipeline).
addopts = -m "not billed"

markers =
    billed: real, text-only OpenAI calls (the AC-4 backfill run - cheap; requires
        explicit -m billed; every real-env-touching run additionally needs fresh,
        explicit human approval per root CLAUDE.md and quickstart.md)

log_cli = true
log_cli_level = INFO
