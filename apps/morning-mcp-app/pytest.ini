[pytest]
markers =
    integration: marks tests as integration tests (hit the real Morning sandbox API)
    billed: marks tests that make real, text-only OpenAI API calls (cheap; require explicit -m billed flag to run, no approval/one-at-a-time discipline required)
    expensive: marks tests that make real vision/image/PDF/DOCX OpenAI API calls (costlier; require explicit -m expensive flag to run, one at a time, with approval every run)
    sanity: curated high-signal subset (Feature 059); every sanity test is ALSO billed or expensive, so it stays excluded by default. Run the whole subset together via scripts/run_sanity.sh as a fast "is anything obviously broken" check. Not a substitute for the full billed/expensive tiers.

# Skip billed and expensive tests by default (require explicit -m flag), mirroring
# apps/denidin-app/pytest.ini
addopts = -m "not billed and not expensive"

log_cli = true
log_cli_level = INFO
