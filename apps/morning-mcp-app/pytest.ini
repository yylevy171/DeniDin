[pytest]
markers =
    integration: marks tests as integration tests (hit the real Morning sandbox API)
    expensive: marks tests that use real OpenAI APIs and incur costs (skip by default)

# Skip expensive tests by default (require explicit -m expensive flag), mirroring
# apps/denidin-app/pytest.ini
addopts = -m "not expensive"

log_cli = true
log_cli_level = INFO
