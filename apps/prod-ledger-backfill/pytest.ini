[pytest]
# Skip billed tests by default (require explicit -m flag) — mirrors apps/denidin-app/pytest.ini
# and apps/morning-mcp-app/pytest.ini. No "expensive" tier for this feature (plan.md's Testing
# section: only unit/ and billed/ — no vision/image/PDF calls anywhere in this pipeline).
addopts = -m "not billed"

markers =
    billed: marks tests that make real, text-only OpenAI API calls or hit the real Morning
        sandbox/prod API (cheap; require explicit -m billed flag to run; every real-prod-touching
        one additionally requires fresh, explicit human approval per root CLAUDE.md — see
        tasks.md's Acceptance Phase)

log_cli = true
log_cli_level = INFO
