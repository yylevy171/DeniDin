# Prod environment only (019-env-separation). Fully independent of
# docker-compose.dev.yml - `docker compose -f docker-compose.prod.yml up`
# never builds, starts, or otherwise touches any dev container.
#
# See docker-compose.dev.yml for the shared-status-volume rationale, the
# FR-014 one-denidin-at-a-time-for-real-traffic constraint, and the
# 2026-07-21 correction: NEITHER app is exempt from CLAUDE.md's "ONE
# ENVIRONMENT SET AT A TIME" rule - morning-mcp-app-prod does NOT get to run
# alongside morning-mcp-app-dev (an earlier version of this comment wrongly
# claimed it could; that assumption caused a real incident).
name: denidin-prod
services:
  denidin-app-prod:
    build:
      context: ./apps/denidin-app
    ports:
      # 2026-09-06 (bugfix-043): host-published health_check_port so the
      # host-level prober can actually reach GET /health - see
      # docker-compose.dev.yml's matching comment for the full incident
      # this fixes. Distinct host port from dev's (8200:8100) so dev+prod
      # can run concurrently without a collision, same pattern as
      # morning-mcp-app-dev/-prod below.
      #
      # 2026-09-07 fix: originally 8101:8100, which collides with an
      # already-running, unrelated webapp-backend-prod container on THIS
      # SAME Windows box, also published on host port 8101 (confirmed live
      # via docker ps against denidin-winprod). Moved to 8201, verified
      # genuinely free on the box before choosing it.
      - "8201:8100"
    volumes:
      - ./apps/denidin-app/config/config.prod.json:/app/config/config.json:ro
      - ./apps/denidin-app/config/runtime_constitution.md:/app/config/runtime_constitution.md:ro
      # bugfix-062 (2026-09-16): the Dockerfile's `VOLUME ["/app/config", ...]`
      # makes /app/config an anonymous volume that `docker compose up -d`
      # (what run_denidin.sh/deploy_release_single.sh actually call) does NOT
      # refresh on redeploy - any file under config/ that isn't explicitly
      # bind-mounted here gets silently frozen at whatever the volume held on
      # its first creation, even across later image rebuilds that add/update
      # it. Confirmed live in prod: this anonymous volume was created
      # 2026-09-07 and neither ledger_recognition_prompt.md nor
      # fee_agreement_templates/ (both added after that date) ever reached
      # the running container - the recognizer silently ran prompt-less on
      # every single turn for over a week, contributing to a real dropped
      # bank-deposit ledger event.
      - ./apps/denidin-app/config/ledger_recognition_prompt.md:/app/config/ledger_recognition_prompt.md:ro
      - ./apps/denidin-app/config/fee_agreement_templates:/app/config/fee_agreement_templates:ro
      - ./apps/denidin-app/data:/app/data
      - ./apps/denidin-app/logs/prod:/app/logs
      - ./shared/mcp-status-prod:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"
    # Feature 070 (US5): bound the `docker logs` json-file stream. Lossy on
    # purpose - full history is retained by the app's own
    # TimedRotatingFileHandler(backupCount=0)+gzip under /app/logs.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  morning-mcp-app-prod:
    build:
      context: ./apps/morning-mcp-app
    ports:
      - "8001:8000"
    volumes:
      - ./apps/morning-mcp-app/config/config.prod.json:/app/config/config.json:ro
      - ./apps/morning-mcp-app/logs/prod:/app/logs
      - ./shared/mcp-status-prod:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"
    # Feature 070 (US5): bound the `docker logs` json-file stream. Lossy on
    # purpose - full history is retained by the app's own
    # TimedRotatingFileHandler(backupCount=0)+gzip under /app/logs.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # Feature 068 — Ledger Web UI. See docker-compose.dev.yml for the rationale. denidin-data
  # here is prod data (./apps/denidin-app/data), mounted READ-ONLY forever — on a coderN
  # clone that path is remapped to the root clone / real prod mount via
  # docker-compose.prod.local.yml, same as the other apps. Feature 087's webapp_data
  # volume is this app's OWN writable state (comments/mappings/notes, seeded from Rapaport's
  # live analyst files — see webapp_data/README.md), a single folder (not per-env, since
  # Rapaport maintains one dataset) and completely separate mount from denidin-data.
  webapp-backend-prod:
    build:
      context: .
      dockerfile: apps/webapp/backend/Dockerfile
    ports:
      - "8101:8100"
    volumes:
      # 2026-09-24: mounts the SAME config.prod.json used for a real prod deploy — no more
      # separate ".container.json" file (see docker-compose.dev.yml for the full rationale).
      - ./apps/webapp/backend/config/config.prod.json:/app/apps/webapp/backend/config/config.json:ro
      - ./apps/webapp/backend/auth/password.hash:/app/apps/webapp/backend/auth/password.hash:ro
      - ./apps/denidin-app/data:/app/apps/denidin-app/data:ro
      - ./apps/webapp/webapp_data:/app/apps/webapp/webapp_data
      - ./apps/webapp/logs/prod:/app/apps/webapp/backend/logs
    restart: "no"

  webapp-frontend-prod:
    build:
      context: .
      dockerfile: apps/webapp/frontend/Dockerfile
    ports:
      - "5101:80"
    environment:
      BACKEND_UPSTREAM: "webapp-backend-prod:8100"
      NGINX_ENVSUBST_FILTER: "^BACKEND_UPSTREAM$$"
    depends_on:
      - webapp-backend-prod
    restart: "no"
