# Prod environment only (019-env-separation). Fully independent of
# docker-compose.dev.yml - `docker compose -f docker-compose.prod.yml up`
# never builds, starts, or otherwise touches any dev container.
#
# See docker-compose.dev.yml for the shared-status-volume rationale, the
# FR-014 one-denidin-at-a-time-for-real-traffic constraint, and the
# 2026-07-21 correction: NEITHER app is exempt from CLAUDE.md's "ONE
# ENVIRONMENT SET AT A TIME" rule - morning-mcp-app-prod does NOT get to run
# alongside morning-mcp-app-dev (an earlier version of this comment wrongly
# claimed it could; that assumption caused a real incident).
name: denidin-prod
services:
  denidin-app-prod:
    build:
      context: ./apps/denidin-app
    volumes:
      - ./apps/denidin-app/config/config.prod.json:/app/config/config.json:ro
      - ./apps/denidin-app/config/runtime_constitution.md:/app/config/runtime_constitution.md:ro
      - ./apps/denidin-app/data:/app/data
      - ./apps/denidin-app/logs/prod:/app/logs
      - ./shared/mcp-status-prod:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"

  morning-mcp-app-prod:
    build:
      context: ./apps/morning-mcp-app
    ports:
      - "8001:8000"
    volumes:
      - ./apps/morning-mcp-app/config/config.prod.json:/app/config/config.json:ro
      - ./apps/morning-mcp-app/logs/prod:/app/logs
      - ./shared/mcp-status-prod:/app/mcp-status
      - ./shared/active_env.json:/app/active-env/active_env.json:ro
    restart: "no"

  # Feature 068 — read-only Ledger Web UI. See docker-compose.dev.yml for the rationale.
  # denidin-data here is prod data (./apps/denidin-app/data), mounted READ-ONLY — on a coderN
  # clone that path is remapped to the root clone / real prod mount via
  # docker-compose.prod.local.yml, same as the other apps.
  webapp-backend-prod:
    build:
      context: .
      dockerfile: apps/webapp/backend/Dockerfile
    ports:
      - "8101:8100"
    volumes:
      - ./apps/webapp/backend/config/config.prod.container.json:/app/apps/webapp/backend/config/config.json:ro
      - ./apps/webapp/backend/auth/password.hash:/app/apps/webapp/backend/auth/password.hash:ro
      - ./apps/denidin-app/data:/app/denidin-data:ro
    restart: "no"

  webapp-frontend-prod:
    build:
      context: .
      dockerfile: apps/webapp/frontend/Dockerfile
    ports:
      - "5101:80"
    environment:
      BACKEND_UPSTREAM: "webapp-backend-prod:8100"
      NGINX_ENVSUBST_FILTER: "^BACKEND_UPSTREAM$$"
    depends_on:
      - webapp-backend-prod
    restart: "no"

  cloudflared-prod:
    image: cloudflare/cloudflared:2024.10.0
    command: tunnel --no-autoupdate run
    env_file:
      - path: ./docker/cloudflared.prod.env
        required: false
    depends_on:
      - webapp-frontend-prod
    restart: "no"
